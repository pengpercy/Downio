name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  version:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Output version string
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    needs: [package, version]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Extract release notes
        id: release_notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]-]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md entry found for $VERSION; falling back to tag message."
            git fetch --tags --force
            git tag -l --format='%(contents)' "$TAG" > "$NOTES_FILE"
          fi

          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.file }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_TYPE_ARGS=(--prerelease --latest=false)
          else
            RELEASE_TYPE_ARGS=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" -t "$VERSION" -F "$RELEASE_NOTES_FILE" "${RELEASE_TYPE_ARGS[@]}"
          else
            gh release create "$TAG" -t "$VERSION" -F "$RELEASE_NOTES_FILE" "${RELEASE_TYPE_ARGS[@]}"
          fi
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: package.*
          path: packages
          merge-multiple: true
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" packages/* --clobber
