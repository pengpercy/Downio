name: Build

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          # Same win-x64 runtime, built separately so the regular package stays unchanged
          - name: Windows 7 x64
            os: windows-2022
            runtime: win-x64
            package: win7-x64
            publish-args: -p:Win7Compat=true
          # NativeAOT cross-compiles osx-x64 on Apple Silicon; the Intel pool is slower and queues longer
          - name: macOS (Intel)
            os: macos-latest
            runtime: osx-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            container: ubuntu:20.04
          # Native arm64 runner instead of cross-compiling on x64; the 20.04 container keeps the glibc 2.31 baseline
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            runtime: linux-arm64
            container: ubuntu:20.04
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    env:
      # Inside the workspace so one cache path works on every runner and in the Linux container
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang lld zlib1g-dev libssl-dev
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ matrix.runtime }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.runtime }}-

      # No separate `dotnet build`: publish compiles the app and its generator project anyway
      - name: Publish
        run: |
          dotnet publish src/Downio/Downio.csproj -c Release -o publish -r ${{ matrix.runtime }} --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true ${{ matrix.publish-args }}

      # Debug symbols (.dSYM bundles, .dbg, .pdb) are ~80 MB on macOS and are never shipped; keep them
      # out of the build artifact the package jobs download, and upload them separately instead.
      - name: Split off debug symbols
        shell: bash
        run: |
          mkdir -p symbols
          find publish -maxdepth 1 \( -name '*.dSYM' -o -name '*.dbg' -o -name '*.pdb' \) -exec mv {} symbols/ \;
      - name: Upload symbols
        uses: actions/upload-artifact@v6
        with:
          name: symbols.${{ matrix.package || matrix.runtime }}
          path: symbols/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "downio.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "downio.${{ matrix.runtime }}.tar" publish

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: downio.${{ matrix.package || matrix.runtime }}
          path: publish/*
          retention-days: 1
