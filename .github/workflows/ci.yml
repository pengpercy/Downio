name: Continuous Integration

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  workflow_dispatch:
  workflow_call:

# A newer push supersedes a running CI of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A "release: vX" commit is pushed together with its tag, and the tag's Release run builds and
    # packages the same tree; building it here too only doubles the macOS runner demand.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:')
    name: Build
    uses: ./.github/workflows/build.yml

  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Output version string
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
